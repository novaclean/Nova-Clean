<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"phone","type":"string","label":"Phone","default":"0451 989 385"},
    {"id":"site","type":"string","label":"Website","default":"novaclean.au"},
    {"id":"navy","type":"color","label":"Brand navy","default":"#14425e"},
    {"id":"accent","type":"color","label":"Brand orange","default":"#c9560f"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b2536;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="onsite" data-composition-id="onsite" data-composition-src="compositions/onsite.html"
        data-start="3" data-duration="3" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="montage" data-composition-id="montage" data-composition-src="compositions/montage.html"
        data-start="6" data-duration="3.6" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="shine" data-composition-id="shine" data-composition-src="compositions/shine.html"
        data-start="9.6" data-duration="2.4" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="12" data-duration="3" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Male voiceover (Kokoro am_michael), one line per scene -->
      <audio id="vo1" class="clip" src="assets/voice/vo1.wav" data-duration="1.79" data-start="0.1" data-track-index="1" data-volume="1"></audio>
      <audio id="vo2" class="clip" src="assets/voice/vo2.wav" data-duration="2.92" data-start="3.05" data-track-index="1" data-volume="1"></audio>
      <audio id="vo3" class="clip" src="assets/voice/vo3.wav" data-duration="3.01" data-start="6.05" data-track-index="1" data-volume="1"></audio>
      <audio id="vo4" class="clip" src="assets/voice/vo4.wav" data-duration="2.15" data-start="9.7" data-track-index="1" data-volume="1"></audio>
      <audio id="vo5" class="clip" src="assets/voice/vo5.wav" data-duration="2.58" data-start="12.2" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
