<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"phone","type":"string","label":"Phone","default":"0451 989 385"},
    {"id":"site","type":"string","label":"Website","default":"novaclean.au"},
    {"id":"navy","type":"color","label":"Brand navy","default":"#14425e"},
    {"id":"accent","type":"color","label":"Brand orange","default":"#c9560f"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b2536;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="26.8"
      data-width="1080"
      data-height="1920"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"

      <div id="concrete" data-composition-id="concrete" data-composition-src="compositions/concrete.html"

      <audio id="v2" class="clip" src="assets/voice/v2.wav" data-start="3.2" data-duration="1.75" data-track-index="1" data-volume="1"></audio>
